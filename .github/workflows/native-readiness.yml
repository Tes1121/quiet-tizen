name: Native build readiness (offline)

on:
  push:
    paths:
      - "launcher/**"
      - "tools/native_preflight.py"
      - "tools/build_native_local.py"
      - "tests/test_native_preflight.py"
      - "tests/test_native_build_local.py"
      - "docs/10-native-build-preflight.md"
      - ".github/workflows/native-readiness.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - name: Verify native source/project metadata (no TV)
        run: |
          set -o pipefail
          python3 tools/native_preflight.py source --json | tee native-readiness.json
      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile open-source Probe only
        run: dotnet build launcher/probe/Probe.csproj -c Release --nologo
      - name: Assemble downloadable native build kit (not an installer)
        run: |
          set -euo pipefail
          mkdir -p .local/native-build-kit/compiled
          git archive --format=tar HEAD | tar -xf - -C .local/native-build-kit
          cp launcher/probe/bin/Release/net6.0/Probe.dll .local/native-build-kit/compiled/Probe.dll
          sha256sum .local/native-build-kit/compiled/Probe.dll > .local/native-build-kit/compiled/SHA256SUMS.txt
          cat > .local/native-build-kit/BUILD-KIT-STATUS.txt <<'EOF'
          QUIET TIZEN NATIVE BUILD KIT - NOT INSTALLABLE YET
          This package contains repository source and a compiled Probe.dll.
          BixbyPromotion.dll and QuickLaunch.dll are NOT included.
          Full native build requires the FOUR TV-matched Samsung reference DLLs:
          Tizen.NUI.dll, Tizen.Applications.Common.dll, Tizen.System.dll, Tizen.dll.
          Follow docs/10-native-build-preflight.md on a compatible isolated build host.
          No TPK/WGT is produced. NO TV, ROOT OR SDB OPERATIONS ARE PERFORMED.
          EOF
          test -s .local/native-build-kit/compiled/Probe.dll
          test ! -e .local/native-build-kit/compiled/BixbyPromotion.dll
          test ! -e .local/native-build-kit/compiled/QuickLaunch.dll
          for dll in Tizen.NUI.dll Tizen.Applications.Common.dll Tizen.System.dll Tizen.dll; do
            test ! -e ".local/native-build-kit/compiled/$dll"
          done
      - name: Upload native build kit ZIP (source + Probe only)
        uses: actions/upload-artifact@v4
        with:
          name: quiet-tizen-native-build-kit
          path: .local/native-build-kit/
          if-no-files-found: error
          retention-days: 14
      - name: Upload non-device readiness report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-readiness-report
          path: native-readiness.json
          if-no-files-found: ignore
          retention-days: 7

# Deliberately no SDB, root, TV IP, deployment or private Samsung DLLs.
# Full BixbyPromotion/QuickLaunch builds require TV-matched, locally held references.
